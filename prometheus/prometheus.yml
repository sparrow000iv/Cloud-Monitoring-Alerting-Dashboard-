global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'aws-cloudwatch'
    static_configs:
      - targets: ['aws-collector:9100']
    scrape_interval: 60s

  - job_name: 'azure-monitor'
    static_configs:
      - targets: ['azure-collector:9101']
    scrape_interval: 60s

  - job_name: 'gcp-monitoring'
    static_configs:
      - targets: ['gcp-collector:9102']
    scrape_interval: 60s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
